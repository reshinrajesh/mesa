# The gate.
#
# `npm run verify` has been the definition of "green" throughout this project —
# typecheck, lint, the domain checks and the test suites, in that order, because
# a type error should not wait behind four minutes of rendering to be reported.
# Until now it only ever ran because somebody remembered to run it, which makes
# it a habit rather than a gate.
name: verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    # Generous rather than tight: the screen suites render whole routes against
    # mock services with real latency, and a timeout that trips on a slow runner
    # teaches people to ignore red.
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # `ci` rather than `install`: the lockfile is the point of running this at
      # all, and `install` would quietly resolve a different tree than the one
      # that was tested locally.
      - run: npm ci

      - run: npm run verify
